<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelare</title>
<style>
:root{--bg:#e8ebf0;--ink:#1b2233;--muted:#5d667a;--track:#c3c9d6;--fill:#1b2233;--knob:#7b8190;--cover:#fff;--line:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2130;--ink:#f1f3f8;--muted:#a3abbe;--track:#3a4257;--fill:#f1f3f8;--knob:#9aa1b3;--cover:#f4f5f8;--line:#f1f3f8}}
:root[data-theme="dark"]{--bg:#1c2130;--ink:#f1f3f8;--muted:#a3abbe;--track:#3a4257;--fill:#f1f3f8;--knob:#9aa1b3;--cover:#f4f5f8;--line:#f1f3f8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.player{position:relative;width:100%;max-width:440px;padding:24px;display:flex;flex-direction:column;align-items:center}

/* Sleep timer-knapp uppe i hörnet */
.top-actions{position:absolute;top:18px;right:18px}
.icon-btn-sm{background:none;border:0;padding:8px;color:var(--muted);cursor:pointer;border-radius:10px;display:grid;place-items:center}
.icon-btn-sm:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.icon-btn-sm:active{opacity:.6}
.icon-btn-sm svg{width:24px;height:24px;fill:currentColor;stroke:none;display:block}
.icon-btn-sm.active{color:var(--ink)}
.sleep-label{position:absolute;top:-2px;right:-6px;font-size:10px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:8px;padding:1px 5px;line-height:1.3;display:none}
.icon-btn-sm.active .sleep-label{display:block}

.top-actions.left{left:18px;right:auto}

.cover-wrap{position:relative;width:min(64vw,260px)}

.cover{
  width:100%;
  aspect-ratio:1;
  background:var(--cover);
  border:4px solid var(--line);
  border-radius:14%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9aa1b3;
  font-size:14px
}

.sleep-status{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:5px 12px;
  border-radius:999px;display:none;align-items:center;gap:6px;
  cursor:pointer;z-index:5;
}
.sleep-status.show{display:inline-flex}
.sleep-status svg{width:14px;height:14px;fill:currentColor;stroke:none}

.sleep-menu{
  position:absolute;top:56px;right:18px;z-index:10;
  background:var(--panel);border:2px solid var(--line);border-radius:14px;
  padding:10px 14px;display:flex;align-items:center;gap:4px;
  transform:translateY(-6px);opacity:0;pointer-events:none;
  transition:transform .16s ease,opacity .16s ease;
}
.sleep-menu.open{transform:translateY(0);opacity:1;pointer-events:auto}
.sleep-menu-title{font-size:12px;color:var(--muted);padding:0 10px 0 2px;border-right:1px solid var(--track);margin-right:4px}
.sleep-option{background:none;border:0;padding:8px 12px;color:var(--ink);font-size:15px;
  border-radius:8px;cursor:pointer;white-space:nowrap}
.sleep-option:hover{background:var(--bg)}
.sleep-cancel{margin-left:4px;padding-left:10px;border-left:1px solid var(--track);
  color:#c0392b;font-size:13px;background:none;border-top:0;border-right:0;border-bottom:0;
  border-radius:0;cursor:pointer;display:none;white-space:nowrap}
.sleep-menu.timer-active .sleep-cancel{display:inline-block}

.cover{width:min(64vw,260px);aspect-ratio:1;background:var(--cover);border:4px solid var(--line);border-radius:14%;display:flex;align-items:center;justify-content:center;color:#9aa1b3;font-size:14px}
.cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:14%}
h1{font-size:30px;font-weight:400;margin:22px 0 26px;letter-spacing:.01em;text-align:center}
.bar{width:100%}
.chapter{font-size:14px;color:var(--muted);margin-bottom:10px}
.track{position:relative;height:28px;cursor:pointer;touch-action:none;outline:none}
.track::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--track)}
.fill{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--fill)}
.knob{position:absolute;top:4px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--knob)}
.track:focus-visible .knob{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.time{font-size:14px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

.ctrl{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:34px;padding:0 2px}
button{background:none;border:0;padding:10px;color:var(--ink);cursor:pointer;border-radius:12px;display:grid;place-items:center}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button:active{opacity:.6}
svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;display:block}

/* Mindre "skip" ikoner mellan pilarna och play */
.skip svg{width:38px;height:38px}
.skip text{font-family:inherit;font-weight:600}
</style>
</head>
<body>
<main class="player">
  <div class="top-actions left">
    <a href="/" class="icon-btn-sm" aria-label="Tillbaka till biblioteket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
</div>

  <div class="top-actions">
    <button id="sleepBtn" class="icon-btn-sm" aria-label="Sleeptimer" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M14 3a9 9 0 1 0 7 14.7A7.5 7.5 0 0 1 14 3z"/></svg>
      <span class="sleep-label" id="sleepLabel"></span>
    </button>
  </div>

  <div class="sleep-menu" id="sleepDrawer">
    <span class="sleep-menu-title">Sleeptimer</span>
    <button class="sleep-option" data-min="30">30 min</button>
    <button class="sleep-option" data-min="45">45 min</button>
    <button class="sleep-option" data-min="60">60 min</button>
    <button class="sleep-cancel" id="sleepCancelBtn">Avbryt</button>
  </div>

  <div class="cover-wrap">
    <div class="cover" id="cover" aria-label="Omslag"></div>
    <div class="sleep-status" id="sleepStatus">
      <svg viewBox="0 0 24 24"><path d="M14 3a9 9 0 1 0 7 14.7A7.5 7.5 0 0 1 14 3z"/></svg>
      <span id="sleepStatusText"></span>
    </div>
  </div>
  <h1 id="title">Titel</h1>

  <div class="bar">
    <div class="chapter" id="chapter"></div>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="Position i kapitlet" aria-valuemin="0">
      <div class="fill" id="fill"></div><div class="knob" id="knob"></div>
    </div>
    <div class="time" id="time"></div>
  </div>

  <div class="ctrl">
    <button id="prev" aria-label="Föregående kapitel"><svg viewBox="0 0 60 60"><path d="M46 10 14 30 46 50z"/></svg></button>
    <button id="skipBack" class="skip" aria-label="Spola tillbaka 15 sekunder">
      <svg viewBox="0 0 60 60">
        <path d="M14 14a22 22 0 1 1 -4 22"/>
        <path d="M10 6 10 18 22 18"/>
        <text x="30" y="37" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">15</text>
      </svg>
    </button>
    <button id="play" aria-label="Spela"><svg id="icon" viewBox="0 0 60 60"></svg></button>
    <button id="skipFwd" class="skip" aria-label="Spola framåt 30 sekunder">
      <svg viewBox="0 0 60 60">
        <path d="M46 14a22 22 0 1 0 4 22"/>
        <path d="M50 6 50 18 38 18"/>
        <text x="30" y="37" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">30</text>
      </svg>
    </button>
    <button id="next" aria-label="Nästa kapitel"><svg viewBox="0 0 60 60"><path d="M14 10 46 30 14 50z"/></svg></button>
  </div>
</main>

<script>
window.addEventListener("pagehide", () => {
  navigator.sendBeacon("/api/stop");
});

let chapters=[];
let ch=0,pos=0,playing=false,timer=null;
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const PAUSE='<rect x="14" y="8" width="10" height="44"/><rect x="36" y="8" width="10" height="44"/>';
const PLAY='<path d="M16 8 52 30 16 52z"/>';

function render(){
  if(!chapters.length) return;
  const c=chapters[ch],p=c.len?pos/c.len*100:0;
  $("chapter").textContent=c.name;
  $("fill").style.width=p+"%";$("knob").style.left=p+"%";
  $("time").textContent=fmt(pos)+" / "+fmt(c.len);
  $("icon").innerHTML=playing?PAUSE:PLAY;
  $("play").setAttribute("aria-label",playing?"Pausa":"Spela");
  $("track").setAttribute("aria-valuemax",c.len);
  $("track").setAttribute("aria-valuenow",Math.floor(pos));
}
let suppressAutoChapterSync = false;

function setChapterIndex(i){
  ch = Math.max(0, Math.min(chapters.length-1, i));
  pos = 0;
  suppressAutoChapterSync = true;
  setTimeout(() => { suppressAutoChapterSync = false; }, 1500);
  render();
}

let syncTickCount = 0;
async function syncProgress(){
  try{
    const res = await fetch("/api/status");
    if(!res.ok) return;
    const data = await res.json();
    const absoluteSec = data.time / 1000;

    const idx = chapters.findIndex(c => absoluteSec >= c.start && absoluteSec < c.start + c.len);
    if(idx !== -1) ch = idx;

    pos = Math.max(0, absoluteSec - chapters[ch].start);
    render();

    syncTickCount++;
    if(syncTickCount % 10 === 0){
      fetch("/api/save-position", {method:"POST"});
    }
  }catch(err){
    console.error("Kunde inte synka progress:", err);
  }
}

function go(i){ch=Math.max(0,Math.min(chapters.length-1,i));pos=0;render()}
function tick(){pos++;if(pos>=chapters[ch].len){if(ch<chapters.length-1)go(ch+1);else{pos=chapters[ch].len;toggle()}}render()}
function toggle(){
  playing=!playing;
  clearInterval(timer);
  if(playing){
    timer=setInterval(syncProgress,1000);
    fetch("/api/play",{method:"POST"});
  } else {
    fetch("/api/pause",{method:"POST"});
  }
  render();
}

async function selectBook(id){
  await fetch("/api/select-book", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id: id})
  });
}

$("play").onclick=toggle;


async function nextChapter(){
  setChapterIndex(ch+1);
  await fetch("/api/next-chapter", {method:"POST"});
  await syncProgress();
}
async function prevChapter(){
  go(pos>3?ch:ch-1);
  await fetch("/api/prev-chapter", {method:"POST"});
  await syncProgress();
}
$("prev").onclick=prevChapter;
$("next").onclick=nextChapter;

const track=$("track");
function seek(e){const r=track.getBoundingClientRect();
  pos=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*chapters[ch].len;render()}
track.addEventListener("pointerdown",e=>{track.setPointerCapture(e.pointerId);seek(e)});
track.addEventListener("pointermove",e=>{if(track.hasPointerCapture(e.pointerId))seek(e)});
track.addEventListener("keydown",e=>{
  const d={ArrowRight:10,ArrowLeft:-10}[e.key];
  if(d){pos=Math.max(0,Math.min(chapters[ch].len,pos+d));render();e.preventDefault()}});

async function loadCurrentBook(){
  const res = await fetch("/api/current-book");
  if(!res.ok) return;
  const book = await res.json();

  $("title").textContent = book.title;

  if(book.cover){
    const img = document.createElement("img");
    img.src = book.cover;
    img.alt = "Omslag";
    $("cover").innerHTML = "";
    $("cover").appendChild(img);
  }

  chapters = (book.chapters && book.chapters.length)
    ? book.chapters.map(c => ({name: c.title, len: c.end - c.start, start: c.start}))
    : [{name:"", len: 0}];

  const savedSec = (book.position || 0) / 1000;
  let idx = chapters.findIndex(c => savedSec >= c.start && savedSec < c.start + c.len);
  if(idx === -1) idx = 0;
  ch = idx;
  pos = Math.max(0, savedSec - chapters[ch].start);

  render();
}

loadCurrentBook();

/* ===== Nytt: skip-knappar och sleeptimer ===== */
/* Rör inget ovanför denna rad. */

async function skipBy(ms){
  try{
    await fetch("/api/seek",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ms})
    });
  }catch(err){
    console.error("Kunde inte spola:", err);
  }
  syncProgress();
}
$("skipBack").onclick=()=>skipBy(-15000);
$("skipFwd").onclick=()=>skipBy(30000);

let sleepTimerActive=false;
const sleepDrawer=$("sleepDrawer");

function toggleDrawer(open){
  sleepDrawer.classList.toggle("open", open);
}

$("sleepBtn").onclick=()=>toggleDrawer(!sleepDrawer.classList.contains("open"));

document.addEventListener("click",(e)=>{
  if(!sleepDrawer.contains(e.target) && e.target!==$("sleepBtn") && !$("sleepBtn").contains(e.target)){
    toggleDrawer(false);
  }
});

async function startSleepTimer(minutes){
  try{
    await fetch("/api/sleep-timer",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({minutes})
    });
    sleepTimerActive=true;
    $("sleepBtn").classList.add("active");
    $("sleepBtn").setAttribute("aria-pressed","true");
    $("sleepStatusText").textContent=minutes+" min";
    $("sleepStatus").classList.add("show");
    sleepDrawer.classList.add("timer-active");
  }catch(err){
    console.error("Kunde inte starta sleeptimer:", err);
  }
  toggleDrawer(false);
}

async function cancelSleepTimer(){
  await fetch("/api/sleep-timer/cancel",{method:"POST"}).catch(()=>{});
  sleepTimerActive=false;
  $("sleepBtn").classList.remove("active");
  $("sleepBtn").setAttribute("aria-pressed","false");
  $("sleepStatus").classList.remove("show");
  sleepDrawer.classList.remove("timer-active");
  toggleDrawer(false);
}

sleepDrawer.querySelectorAll(".sleep-option").forEach(btn=>{
  btn.onclick=()=>startSleepTimer(Number(btn.dataset.min));
});
$("sleepCancelBtn").onclick=cancelSleepTimer;
$("sleepStatus").onclick=()=>toggleDrawer(true);
</script>
</body>
</html>
