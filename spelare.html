<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelare</title>
<style>
:root{--bg:#f3eee6;--ink:#28251f;--muted:#746d61;--track:#d8d0c2;--fill:#8a6845;--knob:#fbf8f2;--cover:#fbf8f2;--line:#d8d0c2;--panel:#fbf8f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181714;--ink:#f3efe7;--muted:#aaa295;--track:#403c35;--fill:#c6a47d;--knob:#f3efe7;--cover:#24221e;--line:#403c35;--panel:#24221e}}
:root[data-theme="dark"]{--bg:#181714;--ink:#f3efe7;--muted:#aaa295;--track:#403c35;--fill:#c6a47d;--knob:#f3efe7;--cover:#24221e;--line:#403c35;--panel:#24221e}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{min-height:100%;background:radial-gradient(circle at 50% 8%,rgba(138,104,69,.10),transparent 28rem),var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.player{position:relative;width:100%;max-width:500px;padding:42px 28px;display:flex;flex-direction:column;align-items:center}
.top-actions{position:absolute;top:20px;right:20px}.icon-btn-sm{background:var(--panel);border:1px solid var(--line);padding:9px;color:var(--muted);cursor:pointer;border-radius:12px;display:grid;place-items:center;transition:transform .18s ease-out,background .18s ease-out,color .18s ease-out,box-shadow .18s ease-out}
.icon-btn-sm:hover{color:var(--ink);transform:translateY(-1px);box-shadow:0 7px 18px rgba(45,35,25,.12)}.icon-btn-sm:focus-visible{outline:2px solid var(--fill);outline-offset:3px}.icon-btn-sm:active{transform:translateY(1px) scale(.97);opacity:.8}
.icon-btn-sm svg{width:22px;height:22px;fill:currentColor;stroke:none;display:block}.icon-btn-sm.active{color:var(--fill)}.sleep-label{position:absolute;top:-5px;right:-7px;font-size:10px;font-weight:700;background:var(--fill);color:var(--bg);border-radius:8px;padding:1px 5px;line-height:1.3;display:none}.icon-btn-sm.active .sleep-label{display:block}.top-actions.left{left:20px;right:auto}
.cover-wrap{position:relative;width:min(70vw,310px)}.cover{width:100%;aspect-ratio:1;background:var(--cover);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;box-shadow:0 22px 48px rgba(45,35,25,.18),0 4px 10px rgba(45,35,25,.08);overflow:hidden;transition:transform .25s ease-out,box-shadow .25s ease-out}.cover:hover{transform:translateY(-3px);box-shadow:0 27px 55px rgba(45,35,25,.22),0 5px 12px rgba(45,35,25,.1)}.cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.sleep-status{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(24,23,20,.72);backdrop-filter:blur(8px);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;display:none;align-items:center;gap:6px;cursor:pointer;z-index:5}.sleep-status.show{display:inline-flex}.sleep-status svg{width:14px;height:14px;fill:currentColor;stroke:none}
.sleep-menu{position:absolute;top:62px;right:20px;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:4px;box-shadow:0 14px 35px rgba(45,35,25,.16);transform:translateY(-6px);opacity:0;pointer-events:none;transition:transform .18s ease-out,opacity .18s ease-out}.sleep-menu.open{transform:translateY(0);opacity:1;pointer-events:auto}
.sleep-menu-title{font-size:12px;color:var(--muted);padding:0 10px 0 2px;border-right:1px solid var(--track);margin-right:4px}.sleep-option{background:none;border:0;padding:8px 12px;color:var(--ink);font-size:14px;border-radius:8px;cursor:pointer;white-space:nowrap}.sleep-option:hover{background:var(--bg)}.sleep-cancel{margin-left:4px;padding-left:10px;border-left:1px solid var(--track);color:#b24b3d;font-size:13px;background:none;border-top:0;border-right:0;border-bottom:0;border-radius:0;cursor:pointer;display:none;white-space:nowrap}.sleep-menu.timer-active .sleep-cancel{display:inline-block}
h1{font-size:clamp(26px,6vw,34px);font-weight:500;margin:25px 0 30px;letter-spacing:-.02em;text-align:center;line-height:1.15}.bar{width:100%}.chapter{font-size:13px;color:var(--muted);margin-bottom:9px;min-height:18px}
.track{position:relative;height:30px;cursor:pointer;touch-action:none;outline:none}.track::before{content:"";position:absolute;left:0;right:0;top:13px;height:5px;border-radius:999px;background:var(--track)}.fill{position:absolute;left:0;top:13px;height:5px;border-radius:999px;background:var(--fill);transition:width .08s linear}.knob{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--knob);box-shadow:0 2px 7px rgba(45,35,25,.2);transition:transform .15s ease-out,box-shadow .15s ease-out}.track:hover .knob{transform:scale(1.12);box-shadow:0 3px 10px rgba(45,35,25,.24)}.track:focus-visible .knob{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fill)}.time{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.ctrl{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding:0 2px}button{background:none;border:0;padding:10px;color:var(--ink);cursor:pointer;border-radius:14px;display:grid;place-items:center;transition:transform .16s ease-out,background .16s ease-out,color .16s ease-out}button:hover{background:var(--panel);transform:translateY(-2px)}button:focus-visible{outline:2px solid var(--fill);outline-offset:3px}button:active{transform:translateY(1px) scale(.95);opacity:.8}
svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;display:block}#play{width:76px;height:76px;border:1px solid var(--line);border-radius:50%;background:var(--panel);box-shadow:0 10px 24px rgba(45,35,25,.14)}#play:hover{box-shadow:0 14px 30px rgba(45,35,25,.18)}#play svg{width:46px;height:46px}.skip svg{width:38px;height:38px}.skip text{font-family:inherit;font-weight:600}
.knob{display:none}
@media (max-width:560px){.player{padding:48px 20px 30px}.cover-wrap{width:min(72vw,290px)}.sleep-menu{right:12px;left:12px;justify-content:center;flex-wrap:wrap}.sleep-menu-title{display:none}.ctrl{margin-top:28px}.ctrl button{padding:8px}.ctrl svg{width:48px;height:48px}.skip svg{width:34px;height:34px}#play{width:68px;height:68px}#play svg{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){.cover,.icon-btn-sm,.sleep-menu,.knob,button{transition:none}}
</style>
</head>
<body>
<main class="player">
  <div class="top-actions left">
    <a href="/" class="icon-btn-sm" aria-label="Tillbaka till biblioteket">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
</div>

  <div class="top-actions">
    <button id="sleepBtn" class="icon-btn-sm" aria-label="Sleeptimer" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M14 3a9 9 0 1 0 7 14.7A7.5 7.5 0 0 1 14 3z"/></svg>
      <span class="sleep-label" id="sleepLabel"></span>
    </button>
  </div>

  <div class="sleep-menu" id="sleepDrawer">
    <span class="sleep-menu-title">Sleeptimer</span>
    <button class="sleep-option" data-min="30">30 min</button>
    <button class="sleep-option" data-min="45">45 min</button>
    <button class="sleep-option" data-min="60">60 min</button>
    <button class="sleep-cancel" id="sleepCancelBtn">Avbryt</button>
  </div>

  <div class="cover-wrap">
    <div class="cover" id="cover" aria-label="Omslag"></div>
    <div class="sleep-status" id="sleepStatus">
      <svg viewBox="0 0 24 24"><path d="M14 3a9 9 0 1 0 7 14.7A7.5 7.5 0 0 1 14 3z"/></svg>
      <span id="sleepStatusText"></span>
    </div>
  </div>
  <h1 id="title">Titel</h1>

  <div class="bar">
    <div class="chapter" id="chapter"></div>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="Position i kapitlet" aria-valuemin="0">
      <div class="fill" id="fill"></div><div class="knob" id="knob"></div>
    </div>
    <div class="time" id="time"></div>
  </div>

  <div class="ctrl">
    <button id="prev" aria-label="Föregående kapitel"><svg viewBox="0 0 60 60"><path d="M46 10 14 30 46 50z"/></svg></button>
    <button id="skipBack" class="skip" aria-label="Spola tillbaka 15 sekunder">
      <svg viewBox="0 0 60 60">
        <path d="M14 14a22 22 0 1 1 -4 22"/>
        <path d="M10 6 10 18 22 18"/>
        <text x="30" y="37" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">15</text>
      </svg>
    </button>
    <button id="play" aria-label="Spela"><svg id="icon" viewBox="0 0 60 60"></svg></button>
    <button id="skipFwd" class="skip" aria-label="Spola framåt 30 sekunder">
      <svg viewBox="0 0 60 60">
        <path d="M46 14a22 22 0 1 0 4 22"/>
        <path d="M50 6 50 18 38 18"/>
        <text x="30" y="37" text-anchor="middle" font-size="15" fill="currentColor" stroke="none">30</text>
      </svg>
    </button>
    <button id="next" aria-label="Nästa kapitel"><svg viewBox="0 0 60 60"><path d="M14 10 46 30 14 50z"/></svg></button>
  </div>
</main>

<script>
window.addEventListener("pagehide", () => {
  navigator.sendBeacon("/api/stop");
});

let chapters=[];
let ch=0,pos=0,playing=false,timer=null;
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const PAUSE='<rect x="14" y="8" width="10" height="44"/><rect x="36" y="8" width="10" height="44"/>';
const PLAY='<path d="M16 8 52 30 16 52z"/>';

function render(){
  if(!chapters.length) return;
  const c=chapters[ch],p=c.len?pos/c.len*100:0;
  $("chapter").textContent=c.name;
  $("fill").style.width=p+"%";$("knob").style.left=p+"%";
  $("time").textContent=fmt(pos)+" / "+fmt(c.len);
  $("icon").innerHTML=playing?PAUSE:PLAY;
  $("play").setAttribute("aria-label",playing?"Pausa":"Spela");
  $("track").setAttribute("aria-valuemax",c.len);
  $("track").setAttribute("aria-valuenow",Math.floor(pos));
}
let suppressAutoChapterSync = false;

function setChapterIndex(i){
  ch = Math.max(0, Math.min(chapters.length-1, i));
  pos = 0;
  suppressAutoChapterSync = true;
  setTimeout(() => { suppressAutoChapterSync = false; }, 1500);
  render();
}

let syncTickCount = 0;
async function syncProgress(){
  try{
    const res = await fetch("/api/status");
    if(!res.ok) return;
    const data = await res.json();
    const absoluteSec = data.time / 1000;

    const idx = chapters.findIndex(c => absoluteSec >= c.start && absoluteSec < c.start + c.len);
    if(idx !== -1) ch = idx;

    pos = Math.max(0, absoluteSec - chapters[ch].start);
    render();

    syncTickCount++;
    if(syncTickCount % 10 === 0){
      fetch("/api/save-position", {method:"POST"});
    }
  }catch(err){
    console.error("Kunde inte synka progress:", err);
  }
}

function go(i){ch=Math.max(0,Math.min(chapters.length-1,i));pos=0;render()}
function tick(){pos++;if(pos>=chapters[ch].len){if(ch<chapters.length-1)go(ch+1);else{pos=chapters[ch].len;toggle()}}render()}
function toggle(){
  playing=!playing;
  clearInterval(timer);
  if(playing){
    timer=setInterval(syncProgress,1000);
    fetch("/api/play",{method:"POST"});
  } else {
    fetch("/api/pause",{method:"POST"});
  }
  render();
}

async function selectBook(id){
  await fetch("/api/select-book", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id: id})
  });
}

$("play").onclick=toggle;


async function nextChapter(){
  setChapterIndex(ch+1);
  await fetch("/api/next-chapter", {method:"POST"});
  await syncProgress();
}
async function prevChapter(){
  go(pos>3?ch:ch-1);
  await fetch("/api/prev-chapter", {method:"POST"});
  await syncProgress();
}
$("prev").onclick=prevChapter;
$("next").onclick=nextChapter;

const track=$("track");
function seek(e){const r=track.getBoundingClientRect();
  pos=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*chapters[ch].len;render()}
track.addEventListener("keydown",e=>{
  const d={ArrowRight:10,ArrowLeft:-10}[e.key];
  if(d){pos=Math.max(0,Math.min(chapters[ch].len,pos+d));render();e.preventDefault()}});

async function loadCurrentBook(){
  const res = await fetch("/api/current-book");
  if(!res.ok) return;
  const book = await res.json();

  $("title").textContent = book.title;

  if(book.cover){
    const img = document.createElement("img");
    img.src = book.cover;
    img.alt = "Omslag";
    $("cover").innerHTML = "";
    $("cover").appendChild(img);
  }

  chapters = (book.chapters && book.chapters.length)
    ? book.chapters.map(c => ({name: c.title, len: c.end - c.start, start: c.start}))
    : [{name:"", len: 0}];

  const savedSec = (book.position || 0) / 1000;
  let idx = chapters.findIndex(c => savedSec >= c.start && savedSec < c.start + c.len);
  if(idx === -1) idx = 0;
  ch = idx;
  pos = Math.max(0, savedSec - chapters[ch].start);

  render();
}

loadCurrentBook();

/* ===== Nytt: skip-knappar och sleeptimer ===== */
/* Rör inget ovanför denna rad. */

async function skipBy(ms){
  try{
    await fetch("/api/seek",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ms})
    });
  }catch(err){
    console.error("Kunde inte spola:", err);
  }
  syncProgress();
}
$("skipBack").onclick=()=>skipBy(-15000);
$("skipFwd").onclick=()=>skipBy(30000);

let sleepTimerActive=false;
const sleepDrawer=$("sleepDrawer");

function toggleDrawer(open){
  sleepDrawer.classList.toggle("open", open);
}

$("sleepBtn").onclick=()=>toggleDrawer(!sleepDrawer.classList.contains("open"));

document.addEventListener("click",(e)=>{
  if(!sleepDrawer.contains(e.target) && e.target!==$("sleepBtn") && !$("sleepBtn").contains(e.target)){
    toggleDrawer(false);
  }
});

async function startSleepTimer(minutes){
  try{
    await fetch("/api/sleep-timer",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({minutes})
    });
    sleepTimerActive=true;
    $("sleepBtn").classList.add("active");
    $("sleepBtn").setAttribute("aria-pressed","true");
    $("sleepStatusText").textContent=minutes+" min";
    $("sleepStatus").classList.add("show");
    sleepDrawer.classList.add("timer-active");
  }catch(err){
    console.error("Kunde inte starta sleeptimer:", err);
  }
  toggleDrawer(false);
}

async function cancelSleepTimer(){
  await fetch("/api/sleep-timer/cancel",{method:"POST"}).catch(()=>{});
  sleepTimerActive=false;
  $("sleepBtn").classList.remove("active");
  $("sleepBtn").setAttribute("aria-pressed","false");
  $("sleepStatus").classList.remove("show");
  sleepDrawer.classList.remove("timer-active");
  toggleDrawer(false);
}

sleepDrawer.querySelectorAll(".sleep-option").forEach(btn=>{
  btn.onclick=()=>startSleepTimer(Number(btn.dataset.min));
});
$("sleepCancelBtn").onclick=cancelSleepTimer;
$("sleepStatus").onclick=()=>toggleDrawer(true);
</script>
</body>
</html>
