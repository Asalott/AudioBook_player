<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bokhylla</title>
<style>
:root{--bg:#e8ebf0;--ink:#1b2233;--muted:#5d667a;--card:#fff;--line:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2130;--ink:#f1f3f8;--muted:#a3abbe;--card:#262c40;--line:#f1f3f8}}
:root[data-theme="dark"]{--bg:#1c2130;--ink:#f1f3f8;--muted:#a3abbe;--card:#262c40;--line:#f1f3f8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;padding:24px}
h1{font-size:26px;font-weight:400;margin:0 0 20px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;max-width:900px;margin:0 auto}
.book{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .1s}
.book:hover{transform:translateY(-2px)}
.book:active{opacity:.6}
.cover{width:100%;aspect-ratio:2/3;background:var(--bg);border:2px solid var(--line);border-radius:6%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;margin-bottom:10px}
.title{font-size:14px;line-height:1.3}
.author{font-size:12px;color:var(--muted);margin-top:4px}
.status{text-align:center;color:var(--muted);margin-top:40px}
</style>
</head>
<body>
<h1>Bokhylla</h1>
<div class="grid" id="grid"></div>
<div class="status" id="status"></div>

<script>
const grid = document.getElementById("grid");
const status = document.getElementById("status");

async function loadBooks(){
  try{
    const res = await fetch("/api/books");
    if(!res.ok) throw new Error("Serverfel " + res.status);
    const books = await res.json();
    if(books.length === 0){
      status.textContent = "Inga böcker hittades i biblioteket.";
      return;
    }
    grid.innerHTML = "";
    books.forEach(book => {
      const card = document.createElement("div");
      card.className = "book";
      card.innerHTML = `
        <div class="cover"><img src=${book.cover_path}></div>
        <div class="title">${book.title}</div>
        <div class="author">${book.author ?? ""}</div>
      `;
      card.onclick = () => selectBook(book.id);
      grid.appendChild(card);
    });
  }catch(err){
    status.textContent = "Kunde inte hämta böcker: " + err.message;
  }
}

async function selectBook(id){
  status.textContent = "Väljer bok...";
  try{
    const res = await fetch("/api/select-book", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id: id})
    });
    if(!res.ok) throw new Error("Serverfel " + res.status);
    // Gå vidare till spelarsidan när boken är vald
    window.location.href = "/spelare.html";
  }catch(err){
    status.textContent = "Kunde inte välja bok: " + err.message;
  }
}

loadBooks();
</script>
</body>
</html>
